<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" fill="none" class="w-full h-auto" aria-hidden="true">
  <defs>
    <!-- Gradiente de fondo del departamento -->
    <linearGradient id="mapa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf5ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d4edd9" stop-opacity="0.75" />
    </linearGradient>
    <filter id="mapa-sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#14532d" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Silueta estilizada de Norte de Santander -->
  <path
    d="M 320 30 
       C 340 45, 380 65, 410 95
       C 435 120, 460 160, 470 200
       C 480 235, 475 270, 490 310
       C 505 345, 520 380, 505 425
       C 490 465, 465 490, 450 530
       C 430 575, 400 615, 370 655
       C 345 690, 315 725, 280 735
       C 255 740, 230 710, 215 670
       C 200 625, 210 580, 190 535
       C 175 500, 140 470, 125 430
       C 110 390, 120 350, 115 310
       C 110 270, 130 230, 145 195
       C 165 150, 185 110, 220 75
       C 250 45, 285 30, 320 30 Z"
    fill="url(#mapa-bg)"
    stroke="#1b7a3e"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="none"
    filter="url(#mapa-sombra)"
  />

  <!-- Trazo sutil de subregiones / cuenca del Catatumbo -->
  <path
    d="M 220 180 Q 280 240, 370 280 T 470 310"
    stroke="#16a34a"
    stroke-width="1.8"
    stroke-dasharray="4 6"
    stroke-opacity="0.5"
  />
  <path
    d="M 150 350 Q 230 400, 320 420 T 430 510"
    stroke="#16a34a"
    stroke-width="1.8"
    stroke-dasharray="4 6"
    stroke-opacity="0.4"
  />

  <!-- Rosa de los vientos estilizada y sutil -->
  <g transform="translate(470, 80)" opacity="0.45" stroke="#14532d">
    <circle cx="0" cy="0" r="22" stroke-width="1.5" stroke-dasharray="2 3" fill="none" />
    <path d="M 0 -20 L 4 -4 L 20 0 L 4 4 L 0 20 L -4 4 L -20 0 L -4 -4 Z" fill="#14532d" />
    <text x="-4" y="-25" font-size="11" font-weight="bold" fill="#14532d" font-family="system-ui">N</text>
  </g>
</svg>
