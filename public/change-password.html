<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUTENS - Cambiar contraseña</title>
  <link rel="icon" type="image/svg+xml" href="/brand/sutens-icono.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-container">
    <aside class="auth-brand">
      <a href="/" aria-label="Volver a SUTENS">
        <img class="auth-logo" src="/brand/sutens-logo-vertical.svg" alt="SUTENS" />
      </a>
      <p class="auth-sobrelinea">Sindicato Unitario de Trabajadores de la Educación de Norte de Santander</p>
      <h2>“Defensa de la Educación, Unidad de los Trabajadores”</h2>
    </aside>
    <div class="card">
      <h1>Cambia tu contraseña</h1>
      <p class="subtitulo">Por seguridad, establece una contraseña personal para continuar.</p>
      <div id="mensaje" class="mensaje"></div>
      <form id="form-cambiar-contrasena">
        <label for="nueva-contrasena">Nueva contraseña</label>
        <input id="nueva-contrasena" type="password" autocomplete="new-password" minlength="8" required />
        <label for="confirmar-contrasena">Confirma tu nueva contraseña</label>
        <input id="confirmar-contrasena" type="password" autocomplete="new-password" minlength="8" required />
        <button type="submit" class="btn btn-primario">Guardar contraseña y continuar</button>
      </form>
      <p class="link"><a href="#" id="cerrar-sesion">Cerrar sesión</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/change-password.js"></script>
</body>
</html>
