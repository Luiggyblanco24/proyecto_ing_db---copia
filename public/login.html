<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUTENS - Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="/brand/sutens-icono.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-container">
    <aside class="auth-brand">
      <a href="/" aria-label="Volver a SUTENS">
        <img class="auth-logo" src="/brand/sutens-logo-vertical.svg" alt="SUTENS" />
      </a>
      <p class="auth-sobrelinea">Sindicato Unitario de Trabajadores de la Educación de Norte de Santander</p>
      <h2>“Defensa de la Educación, Unidad de los Trabajadores”</h2>
      <p>Un espacio para encontrarnos, organizarnos y construir en unidad.</p>
    </aside>
    <div class="card">
      <h1>Iniciar sesión</h1>
      <p class="subtitulo">Ingresa a tu espacio sindical</p>
      <div id="mensaje" class="mensaje"></div>
      <form id="form-login">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primario">Iniciar sesión</button>
      </form>
      <p class="link">¿No tienes cuenta? <a href="/register.html">Regístrate aquí</a></p>
      <p class="link"><a href="/">Volver a sutens.org</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
